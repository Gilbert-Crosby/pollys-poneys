<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Bootstrap Page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar bg-dark" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="#">MySite</a>
      <a class="btn btn-outline-light btn-sm" href="#about">About</a>
    </div>
  </nav>

  <!-- Welcome section -->
  <header class="bg-body-tertiary py-5 text-center">
    <div class="container">
      <h1 class="display-5 fw-bold">Welcome to My Site</h1>
      <p class="lead">A simple page built with Bootstrap.</p>
      <a href="#about" class="btn btn-primary btn-lg">Learn more</a>
    </div>
  </header>

  <!-- Three cards -->
  <section id="about" class="container my-5">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">About me</h5>
            <p class="card-text">A short introduction about who you are.</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">My projects</h5>
            <p class="card-text">A few things you've built or worked on.</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Get in touch</h5>
            <p class="card-text">How people can contact you.</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0 small">&copy; 2026 MySite</p>
  </footer>

</body>
</html>
